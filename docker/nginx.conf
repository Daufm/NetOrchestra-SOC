# Files in conf.d/ are included inside the http{} block, so `map` is valid here.

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# [Fix #7] Trusted proxy: only honour X-Forwarded-For from the Docker bridge
# (172.16.0.0/12 covers the default Docker network range).
# Remove or tighten this if your topology differs.
# set_real_ip_from 172.16.0.0/12;
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # [Fix #7] Restrict request sizes globally; the /api/upload route overrides
    # this for large PCAP files. All other API calls are capped at 2 MB.
    client_max_body_size 2m;

    # [Fix #7] Security headers for all responses
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin"      always;
    add_header Permissions-Policy        "interest-cohort=()" always;
    # CSP — tuned to actual frontend behaviour:
    #   - script-src/style-src: Vite outputs hashed assets served from 'self'
    #   - connect-src: REST API ('self') + WebSocket on same host (ws: / wss:)
    #     The frontend's useLiveEvents.js uses ws: on http and wss: on https,
    #     both to window.location.host, so both schemes must be allowed.
    #   - img-src: data: URIs used by some chart libraries
    # Tighten further once you have a strict hash/nonce strategy.
    add_header Content-Security-Policy   "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # General API proxy — capped at 2 MB, buffering on for small responses
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # [Fix #7] Only forward trusted headers; strip any client-supplied ones.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # [Fix #7] Prevent response-splitting via backend-set headers
        proxy_hide_header  X-Powered-By;

        # Long-running captures / WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # [Fix #7] Evidence upload endpoint: 512 MB cap, streaming (no buffering)
    # Route verified against backend: forensics::router() registers "/upload"
    # under the "/api" prefix → full path is /api/upload (multipart POST).
    # Backend enforces NETO_MAX_UPLOAD_BYTES independently; this Nginx limit
    # is a first line of defence against oversized payloads reaching the backend.
    location /api/upload {
        proxy_pass              http://127.0.0.1:8080;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Stream upload directly to backend; Nginx does not buffer to disk
        client_max_body_size    512m;
        proxy_request_buffering off;

        # [Fix #7] Incomplete-upload timeout: abort stalled uploads after 2 min
        client_body_timeout     120s;
    }

    # Hashed build assets (Vite output) — aggressive long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA entry point: must never be cached so users get fresh bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
