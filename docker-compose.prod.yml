services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netorchestra}
      POSTGRES_USER: ${POSTGRES_USER:-netorchestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  netorchestra:
    # Pull published pre-built image from GitHub Container Registry (ghcr.io)
    image: ghcr.io/${NETO_GH_REPO:-your-org/netorchestra-soc}:${NETO_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${NETO_HTTP_HOST:-127.0.0.1}:${NETO_HTTP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-netorchestra}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-netorchestra}
      NETO_BIND_ADDR: 0.0.0.0:8080
      NETO_CORS_ORIGINS: http://localhost:${NETO_HTTP_PORT:-8080}
      NETO_COOKIE_SECURE: ${NETO_COOKIE_SECURE:-false}
    volumes:
      - evidence-data:/var/lib/netorchestra/evidence
      - workspace-data:/var/lib/netorchestra/workspace
      - ./secrets/ssh:/run/secrets/ssh:ro
      - ./secrets/known_hosts:/etc/netorchestra/known_hosts:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

volumes:
  postgres-data:
  evidence-data:
  workspace-data:
